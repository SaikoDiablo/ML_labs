# single YAML config driving the training pipeline
seed: 42
experiment_name: "lab6_fashionmnist"
run_name: "cnn_baseline"

data:
  root: "./data"
  num_workers: 2
  batch_size: 128
  val_size: 5000

model:
  name: "CNN" 

training:
  epochs: 10               
  lr: 0.001
  optimizer: "adam"
  momentum: 0.9
  weight_decay: 0.0
  scheduler: "none"
  step_size: 3
  gamma: 0.1
  t_max: 10
  plateau_factor: 0.5
  plateau_patience: 2
  grad_accum_steps: 1
  resume_from: "results/checkpoint_epoch_3.pth"         

output:
  results_dir: "./results"
  save_every_epoch: true

  